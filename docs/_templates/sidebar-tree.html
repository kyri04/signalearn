<div class="sl-navigation-header">
  <a id="sl-navigation-title" class="navbar-brand" href="{{ pathto(root_doc) }}">{{ project }}</a>
  <button type="button" class="sl-navigation-close" aria-label="Close navigation">
    <span class="fa-solid fa-xmark" aria-hidden="true"></span>
  </button>
</div>
<div class="sl-navigation-scroll">
<nav class="bd-docs-nav bd-links" aria-label="{{ _('Documentation') }}">
  <div class="bd-toc-item navbar-nav">
    {{ generate_toctree_html(
      "sidebar",
      startdepth=0,
      show_nav_level=theme_show_nav_level | int,
      maxdepth=theme_navigation_depth | int,
      collapse=False,
      includehidden=True,
      titles_only=True
    ) }}
  </div>
</nav>
</div>
