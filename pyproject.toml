[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "signalearn"
version = "0.1.0.dev0"
description = "Consistent data representations and workflows for scientific analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kyriacos Kyriacou" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "dask[array]>=2024.1", "matplotlib>=3.8", "scikit-learn>=1.4", "joblib>=1.2"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
tensorflow = ["tensorflow>=2.16", "keras>=3"]
dev = ["build>=1.2", "pytest>=8"]
docs = ["sphinx>=8.2,<9", "myst-parser>=4,<5", "pydata-sphinx-theme>=0.23,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["signalearn", "signalearn.*"]
namespaces = false

[tool.setuptools.package-data]
signalearn = ["styles/*.mplstyle"]
